<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snippets</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="bar">
  <h1 id="title">Snippets</h1>
  <input id="search" type="search" placeholder="Search" autocomplete="off">
  <select id="tagFilter" aria-label="Filter by tag"><option value="">All tags</option></select>
  <button id="closeBtn" type="button">Close</button>
</header>
<div id="status" class="status" role="status" hidden></div>
<main class="main">
  <aside class="left wrap">
    <ul id="list" class="list"></ul>
    <div class="btnrow">
      <button id="newBtn" type="button">New</button>
      <button id="deleteBtn" type="button" disabled>Delete</button>
    </div>
  </aside>
  <section class="right wrap">
    <p id="placeholder" class="placeholder">Select a snippet or click New</p>
    <div id="tagsPanel" class="tagspanel" hidden></div>
    <div id="syncPanel" class="tagspanel" hidden></div>
    <form id="editor" hidden autocomplete="off">
      <label>Name <input id="name" type="text"></label>
      <div id="nameErr" class="err" hidden></div>
      <label>Tags
        <div id="chips" class="chips"><input id="tagInput" type="text" list="tagList" placeholder="Add tag, press Enter"></div>
      </label>
      <datalist id="tagList"></datalist>
      <div class="grow contentbox">
        <div class="contenthead">
          <label for="content">Content</label>
          <a href="#" id="copyLink" role="button">Copy content</a>
        </div>
        <textarea id="content"></textarea>
      </div>
      <div id="contentErr" class="err" hidden></div>
      <div id="editorNotice" class="notice" role="status" hidden></div>
      <div class="saverow"><button id="saveBtn" type="button" disabled>Save</button></div>
    </form>
  </section>
</main>
<footer class="foot">
  <div class="row"><div id="dataMount"></div><button id="tagsBtn" type="button">Tags</button><button id="syncBtn" type="button">Sync</button><button id="openMgrBtn" type="button">Open manager</button></div>
  <div id="footConfirm" class="row confirm" hidden>
    <span id="confirmText"></span>
    <button id="confirmNo" type="button"></button>
    <button id="confirmYes" type="button"></button>
  </div>
</footer>
<script type="module" src="popup.js"></script>
</body>
</html>
